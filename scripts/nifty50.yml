name: Nifty50 Data Pipeline

on:
  schedule:
    - cron: "30 18 * * *"   # 12:00 AM IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  nightly:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      # -------------------------------
      # NIFTY 50 DATA
      # -------------------------------

      - name: Fetch Nifty 50
        run: node scripts/fetch_nifty.js

      # -------------------------------
      # COMMIT & PUSH
      # -------------------------------

      - name: Commit updated data
        run: |
          git config user.name "amfi-bot"
          git config user.email "bot@github.com"

          git add .
          git commit -m "Nifty50 data update (Nifty)" || echo "No changes"
          git push
