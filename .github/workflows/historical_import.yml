name: One-time Historical Import

on:
  workflow_dispatch:

jobs:
  import:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install DuckDB
      run: |
        curl -fsSL https://duckdb.org/install.sh | sh
        echo "$HOME/.duckdb/bin" >> $GITHUB_PATH
        duckdb --version

    - name: Download funds.db
      run: |
        wget https://github.com/captn3m0/historical-mf-data/releases/latest/download/funds.db.zst
        unzstd funds.db.zst

    - name: Run ETL
      env:
        DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
      run: |
        chmod +x etl/run_etl.sh
        etl/run_etl.sh

    - name: Cleanup
      run: rm -f funds.db funds.db.zst analytics.duckdb
