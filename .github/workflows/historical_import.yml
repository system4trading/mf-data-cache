name: One-time Historical Import

on:
  workflow_dispatch:

jobs:
  import:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install DuckDB
      run: |
        DUCKDB_VERSION=0.10.3
        curl -L https://github.com/duckdb/duckdb/releases/download/v${DUCKDB_VERSION}/duckdb_cli-linux-amd64.zip -o duckdb.zip
        unzip duckdb.zip
        chmod +x duckdb
        sudo mv duckdb /usr/local/bin/
        duckdb --version

    - name: Download funds.db
      run: |
        wget https://github.com/captn3m0/historical-mf-data/releases/latest/download/funds.db.zst
        unzstd funds.db.zst

    - name: Run ETL
      run: |
        chmod +x etl/run_etl.sh
        ./etl/run_etl.sh
      env:
        SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

    - name: Cleanup
      run: rm -f funds.db funds.db.zst analytics.duckdb
