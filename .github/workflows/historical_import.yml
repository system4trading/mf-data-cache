name: Historical Import (DuckDB → CSV)

on:
  workflow_dispatch:

jobs:
  historical-import:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install duckdb requests zstandard

      - name: Run DuckDB ETL
        run: |
          python etl/run_etl.py

      - name: Upload CSV artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mf-historical-csv
          path: export/*.csv
