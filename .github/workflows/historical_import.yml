name: Historical MF Import (DuckDB)

on:
  workflow_dispatch:

jobs:
  etl:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install DuckDB
        run: pip install duckdb

      - name: Prepare directories
        run: |
          mkdir -p raw/navall raw/amfi export

      # Historical NAV (2006 → present)
      - name: Download historical NAVALL (2006 → present)
        run: |
          git clone --depth 1 https://github.com/captn3m0/historical-mf-data temp_nav
          cp -r temp_nav/data/* raw/navall/
          rm -rf temp_nav
          find raw/navall | wc -l

      # Scheme Master
      - name: Download Scheme Master (funds.db)
        run: |
          wget https://github.com/captn3m0/historical-mf-data/releases/latest/download/funds.db.zst
          unzstd funds.db.zst

      # Latest NAV snapshot (optional)
      - name: Download latest NAVAll
        run: |
          curl -A "Mozilla/5.0" -fsSL \
            https://www.amfiindia.com/spages/NAVAll.txt \
            -o raw/navall/NAVAll_latest.txt
          wc -l raw/navall/NAVAll_latest.txt

      - name: Run DuckDB ETL
        run: python etl/run_etl.py

      - name: Verify row counts
        run: |
          python - <<'EOF'
          import duckdb, os

          db = os.path.abspath("analytics.duckdb")
          con = duckdb.connect(db)

          rows = con.execute("""
            SELECT 'analytics.amc', COUNT(*) FROM analytics.amc
            UNION ALL
            SELECT 'analytics.mf_schemes', COUNT(*) FROM analytics.mf_schemes
            UNION ALL
            SELECT 'analytics.mf_nav_history', COUNT(*) FROM analytics.mf_nav_history;
          """).fetchall()

          for r in rows:
              print(r)

          con.close()
          EOF

      - name: Upload CSV artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mf-historical-csv
          path: export/



