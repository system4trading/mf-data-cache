name: Weekly Enrichment & Analytics

on:
  schedule:
    - cron: "0 19 * * 0"   # Sunday 12:30 AM IST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-pipeline
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build MF master
        run: node scripts/build_mf_master.js

      - name: Enrich funds
        run: node scripts/enrich_funds.js

      - name: Build category averages
        run: node scripts/build_category_avg.js

      - name: Commit & push
        run: |
          git config user.name "amfi-bot"
          git config user.email "amfi-bot@users.noreply.github.com"
          git pull --rebase origin main
          git add .
          git commit -m "Weekly enrichment update" || echo "No changes"
          git push
