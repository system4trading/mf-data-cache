name: Weekly AMFI Master Build

on:
  schedule:
    - cron: "0 3 * * 0"   # Sunday 3 AM IST-ish
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-master:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm install

      - name: Build mf_db.json from AMFI
        run: node scripts/build_mf_db_from_amfi.js

      - name: Build mf_master.json (Yahoo validation)
        run: node scripts/build_mf_master.js

      - name: Commit & push
        run: |
          git config user.name "amfi-bot"
          git config user.email "bot@github.com"
          git add mf_db.json mf_master.json
          git commit -m "Weekly AMFI MF master update" || echo "No changes"
          git push
