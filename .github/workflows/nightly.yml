name: Nightly AMFI & Nifty Update

on:
  schedule:
    - cron: "30 18 * * *"   # 12:00 AM IST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-pipeline
  cancel-in-progress: false

jobs:
  nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch AMFI NAV history
        run: node scripts/fetch_amfi.js

      - name: Fetch Nifty 50
        run: node scripts/fetch_nifty.js

      - name: Health check
        run: node scripts/health_check.js

      - name: Commit & push
        run: |
          git config user.name "amfi-bot"
          git config user.email "amfi-bot@users.noreply.github.com"

          # Stash any generated files
          git stash push -u || echo "Nothing to stash"

          # Sync with remote safely
          git pull --rebase origin main

          # Restore generated files
          git stash pop || echo "Nothing to pop"

          # Commit & push
          git add .
          git commit -m "Automated data update" || echo "No changes"
          git push origin main
          
