name: Nightly Data Pipeline

on:
  schedule:
    - cron: "30 18 * * *"   # 12:00 AM IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  nightly:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      # -------------------------------
      # AMFI OFFICIAL DATA
      # -------------------------------
      - name: Fetch AMFI NAV history
        run: node scripts/fetch_amfi.js

      # -------------------------------
      # YAHOO BACKFILL (HISTORICAL)
      # -------------------------------
      - name: Fetch Yahoo historical NAV
        run: node scripts/fetch_yahoo_nav.js

      # -------------------------------
      # NAV RECONCILIATION
      # -------------------------------
      - name: Merge AMFI + Yahoo NAV
        run: node scripts/nav_merge.js

      # -------------------------------
      # NIFTY 50 DATA
      # -------------------------------
      - name: Fetch Nifty 50
        run: node scripts/fetch_nifty.js

      # -------------------------------
      # DATA HEALTH CHECKS
      # -------------------------------
      - name: Health check
        run: node scripts/health_check.js

      # -------------------------------
      # COMMIT & PUSH
      # -------------------------------
      - name: Commit updated data
        run: |
          git config user.name "amfi-bot"
          git config user.email "bot@mf-analytics.local"

          git add .
          git commit -m "Nightly data update (AMFI + Yahoo + Nifty)" || echo "No changes"
          git push
