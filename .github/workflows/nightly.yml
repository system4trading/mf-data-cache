name: Nightly NAV Pipeline

on:
  schedule:
    - cron: "30 18 * * *"   # IST midnight
  workflow_dispatch:

permissions:
  contents: write

jobs:
  nav:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm install

      - name: Fetch AMFI daily NAV
        run: node scripts/fetch_amfi_daily.js

      - name: Fetch Yahoo historical NAV
        run: node scripts/fetch_yahoo_nav.js

      - name: Merge NAV sources
        run: node scripts/nav_merge.js

      - name: Fetch AMFI NAV history
        run: node scripts/fetch_amfi.js

      - name: Fetch Nifty 50
        run: node scripts/fetch_nifty.js

      - name: Health check
        run: node scripts/health_check.js


      - name: Commit & push
        run: |
          git config user.name "amfi-bot"
          git config user.email "bot@github.com"
          git add .
          git commit -m "Nightly NAV update" || echo "No changes"
          git push
