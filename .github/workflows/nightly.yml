name: Nightly AMFI & Nifty Update

on:
  schedule:
    - cron: "30 18 * * *"   # Daily 12:00 AM IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  nightly-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm install node-fetch

      - name: Fetch AMFI historical NAV
        run: node scripts/fetch_amfi.js

      - name: Fetch Nifty 50 historical data
        run: node scripts/fetch_nifty.js

      - name: Data health checks
        run: node scripts/health_check.js

      - name: Commit & push changes
        run: |
          git config user.name "amfi-bot"
          git config user.email "amfi-bot@users.noreply.github.com"
          git pull --rebase origin main
          git add .
          git commit -m "Nightly AMFI & Nifty update" || echo "No changes"
          git push
